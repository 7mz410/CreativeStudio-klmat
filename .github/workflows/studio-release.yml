# Creative Studio release for klmat: a tag push (v0.0.2-test, v0.1.0, ...) builds the unsigned
# packages for macOS, Windows and Linux through rsm's reusable build-release.yml. A tag with a '-'
# is a pre-release. Kept apart from upstream's release.yml so merges stay clean.
name: Studio release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Release klmat
    permissions:
      contents: write
    uses: 7mz410/CreativeStudio-rsm/.github/workflows/build-release.yml@main
    with:
      app: klmat
      package: wordcraft
      version_var: WORDCRAFT_VERSION
      bundle: klmat.app
      tag: ${{ github.ref_name }}
      # Interface catalogs (upstream moved them to craft-i18n); our fork adds ar/wordcraft.tsv.
      # Keep this SHA in step with studio/craft-i18n.rev.
      i18n_repo: 7mz410/craft-i18n
      i18n_ref: 493044f3ea89389438081a8792c71ee7524597aa
